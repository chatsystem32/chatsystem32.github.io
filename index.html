<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Pro EAS Broadcast Simulator</title>
    <style>
        :root {
            --bg-color: #0c0e17;
            --panel-bg: rgba(22, 26, 41, 0.9);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-red: #ff3b30;
            --accent-green: #34c759;
            --text-main: #f5f5f7;
            --text-sub: #8e8e93;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background: radial-gradient(circle at center, #1c2135 0%, var(--bg-color) 100%);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            margin: 10px 0 2px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        p {
            color: var(--text-sub);
            margin-bottom: 24px;
            font-size: 0.9rem;
            text-align: center;
        }

        .panel {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            max-width: 460px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        label {
            display: block;
            margin: 14px 0 4px;
            font-size: 0.85rem;
            color: var(--text-sub);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.4);
            color: var(--text-main);
            font-size: 0.95rem;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-red);
            background: rgba(0, 0, 0, 0.6);
        }

        textarea {
            resize: vertical;
            height: 90px;
            font-family: inherit;
        }

        .row {
            display: flex;
            gap: 12px;
        }

        .row > div {
            flex: 1;
        }

        /* Toggle Button Container */
        .toggle-container {
            display: flex;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 4px;
            margin: 14px 0 8px;
        }

        .toggle-btn {
            flex: 1;
            padding: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            background: transparent;
            color: var(--text-sub);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 0 !important;
        }

        .toggle-btn.active {
            background: rgba(255, 255, 255, 0.15);
            color: var(--text-main);
        }

        .hidden-mode {
            display: none;
        }

        .broadcast-box {
            width: 100%;
            height: 100px;
            background-color: #000;
            border: 2px solid #333;
            border-radius: 8px;
            margin-top: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            box-sizing: border-box;
            transition: background-color 0.05s ease;
        }

        .broadcast-box.active-burst {
            background-color: #b30000;
            border-color: #ff3b30;
        }

        .broadcast-box .alert-title {
            color: #fff;
            font-size: 1.1rem;
            letter-spacing: 1px;
            margin-bottom: 4px;
            display: none;
        }

        .broadcast-box.active-burst .alert-title,
        .broadcast-box.active-crawl .alert-title {
            display: block;
        }

        .crawl-container {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            display: none;
            padding: 0 10px;
            box-sizing: border-box;
        }

        .broadcast-box.active-crawl .crawl-container {
            display: block;
        }

        .crawl-text {
            display: inline-block;
            color: #ecf0f1;
            font-size: 1rem;
            padding-left: 100%;
            animation: crawl 25s linear infinite;
        }

        @keyframes crawl {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        .progress-container {
            margin: 20px 0 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            height: 6px;
            overflow: hidden;
        }

        #progressBar {
            height: 100%;
            width: 0;
            background: linear-gradient(90deg, #ff9500, var(--accent-red));
            transition: width 0.1s linear;
        }

        #statusText {
            font-size: 0.8rem;
            color: var(--text-sub);
            text-align: center;
            margin-bottom: 12px;
            font-style: italic;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button#playBtn {
            background: var(--accent-green);
            color: #fff;
            margin-top: 12px;
        }

        button#playBtn:hover {
            background: #2fb34f;
        }

        button#stopBtn {
            background: var(--accent-red);
            color: #fff;
            display: none;
            margin-top: 12px;
        }

        button#stopBtn:hover {
            background: #df332a;
        }

        button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <h1>EAS Broadcast Simulator</h1>
    <p>Replicates a full broadcast sequence: 3-Beep Intro ➔ Headers ➔ Attention Tone ➔ Voice ➔ EOM.</p>

    <div class="panel">
        <div class="row">
            <div>
                <label for="beepFreq">Intro Beep Freq (Hz)</label>
                <input id="beepFreq" type="number" value="1000" />
            </div>
            <div>
                <label for="beepLen">Beep / Pause (s)</label>
                <input id="beepLen" type="number" value="0.25" step="0.05" />
            </div>
        </div>

        <div class="row">
            <div>
                <label for="freq1">Header Freq 1 (Hz)</label>
                <input id="freq1" type="number" value="853" />
            </div>
            <div>
                <label for="freq2">Header Freq 2 (Hz)</label>
                <input id="freq2" type="number" value="960" />
            </div>
        </div>
        
        <div class="row">
            <div>
                <label for="longDuration">Attention Tone (s)</label>
                <input id="longDuration" type="number" value="8.0" step="0.5" />
            </div>
            <div>
                <label for="volume">Volume</label>
                <input id="volume" type="number" value="0.2" min="0" max="1" step="0.05" />
            </div>
        </div>

        <!-- Mode Swapper -->
        <label>Voice Source Mode</label>
        <div class="toggle-container">
            <button type="button" id="modeTtsBtn" class="toggle-btn active">Live System TTS</button>
            <button type="button" id="modeFileBtn" class="toggle-btn">Custom Audio File</button>
        </div>

        <!-- Mode A: System TTS Configuration -->
        <div id="ttsConfigSection">
            <label for="voiceSelect">EAS TTS Voice Engine</label>
            <select id="voiceSelect"><option value="">Loading system voices...</option></select>
        </div>

        <!-- Mode B: Custom Audio Upload Configuration -->
        <div id="fileConfigSection" class="hidden-mode">
            <label for="audioUpload">Upload Custom TTS File (.mp3, .wav, .ogg)</label>
            <input type="file" id="audioUpload" accept="audio/*" />
        </div>

        <label for="alertText">Alert Text</label>
        <textarea id="alertText">The National Weather Service in Philadelphia has issued a Tornado Warning for Montgomery County, Delaware County, and Bucks County, PA until 9:00 PM. At 7:50 PM, a severe thunderstorm capable of producing a tornado was located near Hamburg, moving East at 35 mph. Hazard: Tornado and quarter-sized hail. Source: Radar-indicated rotation. Impact: Flying debris will be dangerous. Mobile homes will be damaged or destroyed. Roof, window, and vehicle damage is likely. Precautionary Action: TAKE COVER NOW! Move to a basement or interior room on the lowest floor. Avoid windows.</textarea>

        <div id="broadcastBox" class="broadcast-box">
            <div class="alert-title">EMERGENCY ALERT</div>
            <div class="crawl-container">
                <div id="crawlText" class="crawl-text"></div>
            </div>
        </div>

        <div class="progress-container">
            <div id="progressBar"></div>
        </div>
        <div id="statusText">System Ready</div>
        
        <button id="playBtn">Transmit EAS Alert</button>
        <button id="stopBtn">Abort Transmission</button>
    </div>

    <script>
        const playBtn = document.getElementById('playBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusText = document.getElementById('statusText');
        const progressBar = document.getElementById('progressBar');
        const broadcastBox = document.getElementById('broadcastBox');
        const crawlText = document.getElementById('crawlText');
        const voiceSelect = document.getElementById('voiceSelect');

        // Mode Switching Nodes
        const modeTtsBtn = document.getElementById('modeTtsBtn');
        const modeFileBtn = document.getElementById('modeFileBtn');
        const ttsConfigSection = document.getElementById('ttsConfigSection');
        const fileConfigSection = document.getElementById('fileConfigSection');
        const audioUpload = document.getElementById('audioUpload');

        let audioCtx = null;
        let activeNodes = [];
        let isPlaying = false;
        let currentUtterance = null;
        let activeAudioElement = null; // Stores uploaded audio track while playing
        let currentMode = 'tts'; // 'tts' or 'file'

        // Swap Interface Layout Depending on Mode Selection
        modeTtsBtn.addEventListener('click', () => {
            currentMode = 'tts';
            modeTtsBtn.classList.add('active');
            modeFileBtn.classList.remove('active');
            ttsConfigSection.classList.remove('hidden-mode');
            fileConfigSection.classList.add('hidden-mode');
        });

        modeFileBtn.addEventListener('click', () => {
            currentMode = 'file';
            modeFileBtn.classList.add('active');
            modeTtsBtn.classList.remove('active');
            fileConfigSection.classList.remove('hidden-mode');
            ttsConfigSection.classList.add('hidden-mode');
        });

        function populateVoices() {
            if (typeof speechSynthesis === 'undefined') return;
            const voices = speechSynthesis.getVoices();
            voiceSelect.innerHTML = '';
            
            voices.forEach((voice) => {
                const option = document.createElement('option');
                option.value = voice.lang;
                option.textContent = `${voice.name} (${voice.lang})`;
                if (voice.name.includes('David') || voice.name.includes('Zira') || voice.name.includes('Google US English')) {
                    option.selected = true;
                }
                option.setAttribute('data-name', voice.name);
                voiceSelect.appendChild(option);
            });
        }
        populateVoices();
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = populateVoices;
        }

        function updateProgress(percent) {
            progressBar.style.width = percent + '%';
        }

        function createTone(freq1, freq2, duration, startTime, vol) {
            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            osc1.type = 'sine';
            osc2.type = 'sine';
            osc1.frequency.value = freq1;
            osc2.frequency.value = freq2;

            gainNode.gain.setValueAtTime(vol / 2, startTime);
            gainNode.gain.setValueAtTime(vol / 2, startTime + duration - 0.02);
            gainNode.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

            osc1.connect(gainNode);
            osc2.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc1.start(startTime);
            osc2.start(startTime);
            osc1.stop(startTime + duration);
            osc2.stop(startTime + duration);

            activeNodes.push(osc1, osc2, gainNode);
        }

        function createHeaderBurst(startTime, vol) {
            const duration = 0.25;
            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            osc1.type = 'sine';
            osc2.type = 'sine';
            osc1.frequency.value = 2083.3;
            osc2.frequency.value = 1562.5;

            gainNode.gain.setValueAtTime(vol / 2, startTime);
            gainNode.gain.setValueAtTime(vol / 2, startTime + duration - 0.01);
            gainNode.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

            osc1.connect(gainNode);
            osc2.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc1.start(startTime);
            osc2.start(startTime);
            osc1.stop(startTime + duration);
            osc2.stop(startTime + duration);

            activeNodes.push(osc1, osc2, gainNode);
        }

        function triggerEomTails(vol) {
            if (!isPlaying) return;
            broadcastBox.className = 'broadcast-box active-burst';
            statusText.textContent = "Transmitting EOM Tails...";
            updateProgress(90);
            
            // Generate a brand new context for post-voice processing safely
            const postAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            let eomTime = postAudioCtx.currentTime;
            
            // Internal logic to run standalone oscillators 
            const runEomOsc = (f1, f2, dur, start) => {
                const o1 = postAudioCtx.createOscillator();
                const o2 = postAudioCtx.createOscillator();
                const g = postAudioCtx.createGain();
                o1.frequency.value = f1; o2.frequency.value = f2;
                g.gain.setValueAtTime(vol / 2, start);
                g.gain.setValueAtTime(vol / 2, start + dur - 0.01);
                g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
                o1.connect(g); o2.connect(g); g.connect(postAudioCtx.destination);
                o1.start(start); o2.start(start); o1.stop(start + dur); o2.stop(start + dur);
                activeNodes.push(o1, o2, g);
            };

            for (let i = 0; i < 3; i++) {
                runEomOsc(2083.3, 1562.5, 0.25, eomTime);
                eomTime += 1.25; 
            }

            setTimeout(() => {
                if (!isPlaying) return;
                stopAll();
                statusText.textContent = "Transmission Finished Successfully.";
            }, (eomTime - postAudioCtx.currentTime) * 1000);
        }

        function stopAll() {
            isPlaying = false;
            if (speechSynthesis) speechSynthesis.cancel();
            
            if (activeAudioElement) {
                activeAudioElement.pause();
                activeAudioElement.currentTime = 0;
                activeAudioElement = null;
            }

            activeNodes.forEach(node => {
                try { node.stop(); } catch(e){}
                try { node.disconnect(); } catch(e){}
            });
            activeNodes = [];

            if (audioCtx) {
                audioCtx.close();
                audioCtx = null;
            }

            broadcastBox.className = 'broadcast-box';
            statusText.textContent = "Transmission Aborted.";
            updateProgress(0);
            playBtn.style.display = 'block';
            stopBtn.style.display = 'none';
        }

        function playSequence() {
            // Early file validation check
            if (currentMode === 'file' && audioUpload.files.length === 0) {
                alert("Please select and upload an audio file first!");
                return;
            }

            isPlaying = true;
            playBtn.style.display = 'none';
            stopBtn.style.display = 'block';

            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const vol = parseFloat(document.getElementById('volume').value) || 0.2;
            
            const bFreq = parseFloat(document.getElementById('beepFreq').value) || 1000;
            const bLen = parseFloat(document.getElementById('beepLen').value) || 0.25;
            
            const f1 = parseFloat(document.getElementById('freq1').value) || 853;
            const f2 = parseFloat(document.getElementById('freq2').value) || 960;
            const attLen = parseFloat(document.getElementById('longDuration').value) || 8.0;
            const textToSpeak = document.getElementById('alertText').value;

            let now = audioCtx.currentTime;

            // Phase 1: 3-Beep Attention Intro
            statusText.textContent = "Sending Intro Beeps...";
            updateProgress(10);
            for(let i=0; i<3; i++) {
                createTone(bFreq, bFreq, bLen, now, vol);
                now += (bLen * 2);
            }

            // Phase 2: S.A.M.E Header Bursts
            setTimeout(() => {
                if (!isPlaying) return;
                statusText.textContent = "Transmitting S.A.M.E. Headers...";
                broadcastBox.classList.add('active-burst');
                updateProgress(30);
            }, (now - audioCtx.currentTime) * 1000);

            for (let i = 0; i < 3; i++) {
                createHeaderBurst(now, vol);
                now += 1.25;
            }

            // Phase 3: Attention Dual Tone
            setTimeout(() => {
                if (!isPlaying) return;
                broadcastBox.classList.remove('active-burst');
                statusText.textContent = "Broadcasting Attention Tone...";
                updateProgress(50);
            }, (now - audioCtx.currentTime) * 1000);

            createTone(f1, f2, attLen, now, vol);
            now += attLen + 0.5;

            // Phase 4: Audio Voice Relay Selection
            setTimeout(() => {
                if (!isPlaying) return;
                statusText.textContent = "Relaying Voice Announcement...";
                updateProgress(75);
                broadcastBox.classList.add('active-crawl');
                crawlText.textContent = textToSpeak;

                if (currentMode === 'tts') {
                    // System TTS Path
                    currentUtterance = new SpeechSynthesisUtterance(textToSpeak);
                    const selectedOption = voiceSelect.selectedOptions[0]?.getAttribute('data-name');
                    const voices = speechSynthesis.getVoices();
                    const matchedVoice = voices.find(v => v.name === selectedOption);
                    if (matchedVoice) currentUtterance.voice = matchedVoice;

                    currentUtterance.rate = 0.85;  
                    currentUtterance.pitch = 0.70; 
                    
                    currentUtterance.onend = () => {
                        if (!isPlaying) return;
                        broadcastBox.classList.remove('active-crawl');
                        triggerEomTails(vol);
                    };
                    speechSynthesis.speak(currentUtterance);

                } else {
                    // Custom Upload Audio File Path
                    const file = audioUpload.files[0];
                    const fileUrl = URL.createObjectURL(file);
                    
                    activeAudioElement = new Audio(fileUrl);
                    activeAudioElement.volume = vol;
                    
                    activeAudioElement.onended = () => {
                        if (!isPlaying) return;
                        broadcastBox.classList.remove('active-crawl');
                        URL.revokeObjectURL(fileUrl);
                        triggerEomTails(vol);
                    };

                    activeAudioElement.play().catch(err => {
                        console.error("Audio playback failed:", err);
                        stopAll();
                        alert("Could not play the uploaded file. Ensure it is a valid audio format.");
                    });
                }

            }, (now - audioCtx.currentTime) * 1000);
        }

        playBtn.addEventListener('click', () => {
            if(!isPlaying) playSequence();
        });

        stopBtn.addEventListener('click', stopAll);
    </script>
</body>
</html>
